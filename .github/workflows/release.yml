name: Release
run-name: Release ${{ inputs.bump }} version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: SemVer part to release; use current for the first v0.1.0 release
        required: true
        default: patch
        type: choice
        options:
          - current
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out main with tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select release version
        id: version
        shell: pwsh
        run: |
          $version = ./scripts/bump-version.ps1 -Part '${{ inputs.bump }}'
          if (git tag --list "v$version") {
            throw "Tag v$version already exists. Choose a SemVer bump."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

  build_windows:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-2025
            rust_target: x86_64-pc-windows-msvc
          - architecture: arm64
            runner: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out main with tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 11.17.0
          runtime: node@24
          cache: true
          install: false

      - name: Install pinned Rust checks
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy

      - name: Verify native Rust architecture
        shell: pwsh
        run: |
          $hostTriple = rustc +1.97.1 -vV | Select-String '^host:' | ForEach-Object { $_.Line.Split(':', 2)[1].Trim() }
          if ($hostTriple -ne '${{ matrix.rust_target }}') {
            throw "Expected Rust host ${{ matrix.rust_target }}, received $hostTriple."
          }

      - name: Apply prepared release version
        shell: pwsh
        run: |
          $version = ./scripts/bump-version.ps1 -Part '${{ inputs.bump }}'
          if ($version -ne '${{ needs.prepare.outputs.version }}') {
            throw "Prepared version ${{ needs.prepare.outputs.version }} differs from $version."
          }

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Refresh Cargo lockfile version
        run: cargo +1.97.1 check --manifest-path src-tauri/Cargo.toml

      - name: Check frontend types
        run: pnpm typecheck

      - name: Check Rust formatting
        run: cargo +1.97.1 fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Lint Rust
        run: cargo +1.97.1 clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test Rust
        run: cargo +1.97.1 test --locked --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Build Windows installers
        run: pnpm tauri:build

      - name: Build MCP server
        run: pnpm build:mcp

      - name: Prepare portable and Scoop artifacts
        shell: pwsh
        run: ./scripts/prepare-release.ps1 -Version '${{ needs.prepare.outputs.version }}' -Repository '${{ github.repository }}' -Architecture '${{ matrix.architecture }}'

      - name: Stage release metadata
        if: matrix.architecture == 'x64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-state/src-tauri | Out-Null
          Copy-Item package.json release-state/package.json
          Copy-Item src-tauri/Cargo.toml release-state/src-tauri/Cargo.toml
          Copy-Item src-tauri/Cargo.lock release-state/src-tauri/Cargo.lock
          Copy-Item src-tauri/tauri.conf.json release-state/src-tauri/tauri.conf.json

      - name: Upload architecture release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release-${{ matrix.architecture }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload release metadata
        if: matrix.architecture == 'x64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-state
          path: release-state/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, build_windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out the reviewed source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download x64 release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-release-x64
          path: release/x64

      - name: Download ARM64 release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-release-arm64
          path: release/arm64

      - name: Download release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-state
          path: release-state

      - name: Merge Scoop architecture manifests
        shell: pwsh
        run: |
          ./scripts/merge-scoop-manifests.ps1 `
            -X64Manifest release/x64/samsung-reminder-x64.json `
            -Arm64Manifest release/arm64/samsung-reminder-arm64.json `
            -OutputPath bucket/samsung-reminder.json

      - name: Commit and tag the tested release state
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          git fetch origin main --tags
          if ((git rev-parse origin/main).Trim() -ne $env:SOURCE_SHA) {
            throw 'main changed while the release was building; rerun against the new revision.'
          }

          Copy-Item release-state/package.json package.json
          Copy-Item release-state/src-tauri/Cargo.toml src-tauri/Cargo.toml
          Copy-Item release-state/src-tauri/Cargo.lock src-tauri/Cargo.lock
          Copy-Item release-state/src-tauri/tauri.conf.json src-tauri/tauri.conf.json

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json bucket/samsung-reminder.json
          git commit -m "chore(release): v$env:VERSION"
          git tag -a $env:TAG -m "Reminder $env:TAG"

          gh auth setup-git
          git push origin HEAD:main
          git push origin $env:TAG

      - name: Publish complete GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath release -Recurse -File |
            Where-Object Name -NotMatch '^samsung-reminder-(x64|arm64)\.json$' |
            ForEach-Object FullName)
          $assets += (Resolve-Path bucket/samsung-reminder.json).Path
          gh release create $env:TAG @assets --draft --verify-tag --title "Reminder $env:TAG" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
          gh release edit $env:TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }

      - name: Write release summary
        shell: pwsh
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          "## Reminder $env:TAG" >> $env:GITHUB_STEP_SUMMARY
          'Published x64 and ARM64 NSIS, MSI, portable ZIP, SHA-256, MCP, and Scoop artifacts.' >> $env:GITHUB_STEP_SUMMARY
